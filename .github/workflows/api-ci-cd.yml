name: API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'ticketify-core-api-main/**'
      - '.github/workflows/api-ci-cd.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: ticketify-core-api-main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ticketify-core-api-main/package-lock.json
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: ticketify-core-api-main/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: ticketify-core-api-main/dist
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
      - name: Sync API, migrate, and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          USER="${DEPLOY_USER:-ubuntu}"
          PATH_ON_HOST="${DEPLOY_PATH:-/home/ubuntu/soar-api}"
          HOST="${DEPLOY_HOST:?Set GitHub secret DEPLOY_HOST}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy.pem "$USER@$HOST" "mkdir -p $PATH_ON_HOST"
          rsync -az -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy.pem" \
            --exclude node_modules --exclude .env --exclude storage --exclude .git \
            ./ticketify-core-api-main/ "$USER@$HOST:$PATH_ON_HOST/"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy.pem "$USER@$HOST" bash -s <<EOF
            set -e
            cd $PATH_ON_HOST
            npm install --legacy-peer-deps
            npx prisma migrate deploy
            npx prisma generate
            npm run build
            pm2 restart soar-api --update-env || pm2 start dist/src/main.js --name soar-api
            pm2 save || true
          EOF
