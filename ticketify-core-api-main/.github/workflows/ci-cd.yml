name: NestJS CI/CD

on:
  push:
    branches:
      - main # Trigger on push to main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Upload dist folder as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-folder
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/soar-uat.pem
          chmod 600 ~/.ssh/soar-uat.pem
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/soar-uat.pem

      - name: Download dist folder artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-folder
          path: ./dist

      - name: Copy files to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/soar-uat.pem -r ./dist ubuntu@ec2-15-206-166-250.ap-south-1.compute.amazonaws.com:/home/ubuntu/soar-api

      - name: SSH into EC2, pull latest code, run Prisma deploy, and restart app
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/soar-uat.pem ubuntu@ec2-15-206-166-250.ap-south-1.compute.amazonaws.com <<EOF
            cd /home/ubuntu/soar-api
            git pull origin main # Pull the latest code from the repository
            npm install --legacy-peer-deps # Ensure dependencies are up-to-date
            npx prisma migrate deploy # Apply Prisma migrations
            pm2 restart soar-api || pm2 start dist/src/main.js --name "soar-api" # Restart or start the app
          EOF
